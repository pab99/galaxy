<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Galaxias · Viajero</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000008; touch-action:none; }

/* ── Pantalla Instagram ── */
#screen-ig {
  position:fixed; inset:0; z-index:10;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:24px; padding:32px;
  background: radial-gradient(ellipse at 50% 60%, #040d2e 0%, #000008 70%);
}
.logo-title {
  font-family:'Georgia',serif;
  font-size:clamp(22px,6vw,36px);
  letter-spacing:0.18em;
  color:rgba(180,220,255,0.92);
  text-align:center;
  text-shadow:0 0 40px rgba(80,140,255,0.5);
}
.logo-sub {
  font-family:'Georgia',serif;
  font-size:clamp(11px,3vw,14px);
  letter-spacing:0.3em;
  color:rgba(120,170,255,0.45);
  text-transform:uppercase;
  text-align:center;
  margin-top:-14px;
}
.stars-deco {
  font-size:20px; letter-spacing:0.4em;
  color:rgba(160,210,255,0.3);
}

.input-wrap {
  width:100%; max-width:340px;
  position:relative;
}
.input-wrap input {
  width:100%;
  background:rgba(10,25,70,0.5);
  border:1px solid rgba(80,140,220,0.35);
  border-radius:12px;
  padding:14px 16px 14px 42px;
  font-size:18px;
  color:rgba(200,230,255,0.9);
  font-family:'Georgia',serif;
  letter-spacing:0.05em;
  outline:none;
  -webkit-tap-highlight-color:transparent;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.input-wrap input:focus {
  border-color:rgba(100,170,255,0.7);
  box-shadow:0 0 20px rgba(60,120,255,0.2);
}
.input-wrap input::placeholder { color:rgba(120,160,210,0.4); }
.at-sign {
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  font-size:18px; color:rgba(120,170,255,0.5);
  font-family:'Georgia',serif; pointer-events:none;
}

.btn-primary {
  width:100%; max-width:340px;
  background:linear-gradient(135deg,rgba(20,55,160,0.6),rgba(10,30,100,0.4));
  border:1px solid rgba(80,150,255,0.45);
  border-radius:12px;
  padding:15px;
  font-family:'Georgia',serif;
  font-size:15px; letter-spacing:0.25em;
  color:rgba(180,220,255,0.9);
  text-transform:uppercase;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:all 0.25s ease;
  touch-action:manipulation;
}
.btn-primary:active {
  background:linear-gradient(135deg,rgba(40,90,200,0.7),rgba(20,55,150,0.5));
  transform:scale(0.97);
}
.error-msg {
  font-family:'Georgia',serif;
  font-size:12px; letter-spacing:0.15em;
  color:rgba(255,150,150,0.7);
  text-align:center; min-height:16px;
}

/* ── Pantalla Pad ── */
#screen-pad {
  display:none;
  position:fixed; inset:0; z-index:10;
  flex-direction:column;
  background:#000008;
}

#pad-header {
  padding:14px 18px 10px;
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0;
}
#pad-user {
  font-family:'Georgia',serif;
  font-size:13px; letter-spacing:0.18em;
  color:rgba(140,190,255,0.55);
}
#pad-warps {
  font-family:'Georgia',serif;
  font-size:11px; letter-spacing:0.2em;
  color:rgba(100,150,255,0.35);
}

#pad-canvas-wrap {
  flex:1; position:relative; overflow:hidden;
}
#pad-canvas {
  display:block; width:100%; height:100%;
  touch-action:none;
}

#pad-footer {
  padding:10px 18px 20px;
  text-align:center; flex-shrink:0;
}
#pad-hint {
  font-family:'Georgia',serif;
  font-size:11px; letter-spacing:0.25em;
  color:rgba(120,170,255,0.35);
  text-transform:uppercase;
}

/* Feedback de warp */
#warp-feedback {
  position:fixed; inset:0; z-index:50; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  opacity:0; transition:opacity 0.3s ease;
}
#warp-feedback .wf-text {
  font-family:'Georgia',serif;
  font-size:clamp(18px,5vw,28px);
  letter-spacing:0.22em;
  color:rgba(210,235,255,0.95);
  text-shadow:0 0 30px rgba(80,150,255,0.8);
  text-transform:uppercase;
}
#warp-feedback .wf-sub {
  font-family:'Georgia',serif;
  font-size:clamp(10px,2.5vw,13px);
  letter-spacing:0.3em;
  color:rgba(140,190,255,0.55);
  margin-top:8px;
}
</style>
</head>
<body>

<!-- Pantalla 1: Instagram -->
<div id="screen-ig">
  <div class="stars-deco">✦ ✦ ✦</div>
  <div class="logo-title">Galaxias<br>de Catamarca</div>
  <div class="logo-sub">Viaje interestelar</div>

  <div class="input-wrap">
    <span class="at-sign">@</span>
    <input id="ig-input" type="text" inputmode="text"
      placeholder="tu usuario de instagram"
      autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
  </div>
  <button class="btn-primary" id="ig-btn">✦ Comenzar el viaje</button>
  <div class="error-msg" id="ig-error"></div>
</div>

<!-- Pantalla 2: Pad de control -->
<div id="screen-pad">
  <div id="pad-header">
    <div id="pad-user">@<span id="pad-ig"></span></div>
    <div id="pad-warps">VIAJES: <span id="warp-count">0</span></div>
  </div>
  <div id="pad-canvas-wrap">
    <canvas id="pad-canvas"></canvas>
  </div>
  <div id="pad-footer">
    <div id="pad-hint">✦ tocá el espacio para viajar ✦</div>
  </div>
</div>

<!-- Feedback warp -->
<div id="warp-feedback">
  <div class="wf-text">¡Viajando!</div>
  <div class="wf-sub">velocidad de la luz</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// USUARIO.HTML — celular del visitante
// ═══════════════════════════════════════════════════════════════════════════
const socket = io({ query:{ role:'user' } });

let myIG = '';
let warpCount = 0;
let padW, padH;
let canWarp = true; // throttle

// ─── Socket events ───────────────────────────────────────────────────────────
socket.on('join_ok', data => {
  myIG = data.instagram;
  showPad();
});

socket.on('warp_ack', () => {
  showWarpFeedback();
  setTimeout(() => { canWarp = true; }, 2200);
});

// ─── Instagram form ──────────────────────────────────────────────────────────
document.getElementById('ig-btn').addEventListener('click', submitIG);
document.getElementById('ig-input').addEventListener('keydown', e => {
  if(e.key==='Enter') submitIG();
});

function submitIG(){
  const raw=document.getElementById('ig-input').value.trim().replace(/^@/,'');
  const ig=raw.toLowerCase().replace(/[^a-z0-9._]/g,'');
  if(!ig||ig.length<1){
    document.getElementById('ig-error').textContent='Ingresá tu usuario de Instagram';
    return;
  }
  document.getElementById('ig-error').textContent='';
  socket.emit('user_join',{ instagram: ig });
}

// ─── Mostrar pad ─────────────────────────────────────────────────────────────
function showPad(){
  document.getElementById('screen-ig').style.display='none';
  const sp=document.getElementById('screen-pad');
  sp.style.display='flex';
  document.getElementById('pad-ig').textContent=myIG;
  initPad();
}

// ─── Pad canvas — campo de estrellas mini ────────────────────────────────────
const padCanvas = document.getElementById('pad-canvas');
const pc = padCanvas.getContext('2d');
let padStars=[];

function initPad(){
  padW=padCanvas.width=padCanvas.offsetWidth;
  padH=padCanvas.height=padCanvas.offsetHeight;
  padStars=Array.from({length:180},()=>({
    x:Math.random()*padW, y:Math.random()*padH,
    r:0.3+Math.random()*1.2,
    twinkle:Math.random()*Math.PI*2,
    speed:0.4+Math.random()*1.0
  }));
  drawPad();
}

let padRipples=[];
let lastPadT=performance.now();

function drawPad(){
  requestAnimationFrame(drawPad);
  const now=performance.now()*0.001;
  const dt=Math.min((now-lastPadT),0.05); lastPadT=now;

  pc.fillStyle='#000008';
  pc.fillRect(0,0,padW,padH);

  // Nebulosa sutil
  const grd=pc.createRadialGradient(padW*0.5,padH*0.4,0,padW*0.5,padH*0.4,padW*0.6);
  grd.addColorStop(0,'rgba(15,25,80,0.18)');
  grd.addColorStop(1,'rgba(0,0,8,0)');
  pc.fillStyle=grd; pc.fillRect(0,0,padW,padH);

  // Estrellas
  for(const s of padStars){
    const a=0.25+0.45*Math.abs(Math.sin(s.twinkle+now*s.speed*0.5));
    pc.beginPath(); pc.arc(s.x,s.y,s.r,0,Math.PI*2);
    pc.fillStyle=`rgba(200,220,255,${a.toFixed(2)})`; pc.fill();
  }

  // Ripples de toque
  for(let i=padRipples.length-1;i>=0;i--){
    const rip=padRipples[i];
    rip.age+=dt;
    if(rip.age>1.5){padRipples.splice(i,1);continue;}
    const t=rip.age/1.5;
    const r=t*Math.min(padW,padH)*0.45;
    const a=(1-t)*0.6;
    pc.beginPath(); pc.arc(rip.x,rip.y,r,0,Math.PI*2);
    pc.strokeStyle=`rgba(120,190,255,${a.toFixed(2)})`;
    pc.lineWidth=1.5*(1-t); pc.stroke();
    // Segunda onda
    if(rip.age>0.15){
      const r2=(t-0.1)*Math.min(padW,padH)*0.35;
      const a2=(1-t)*0.35;
      pc.beginPath(); pc.arc(rip.x,rip.y,Math.max(0,r2),0,Math.PI*2);
      pc.strokeStyle=`rgba(160,210,255,${a2.toFixed(2)})`;
      pc.lineWidth=1*(1-t); pc.stroke();
    }
  }

  // Viñeta
  const vig=pc.createRadialGradient(padW/2,padH/2,padH*0.2,padW/2,padH/2,padH*0.75);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,10,0.65)');
  pc.fillStyle=vig; pc.fillRect(0,0,padW,padH);

  // Cruz de mira sutil en el centro
  const cx=padW/2, cy=padH/2, csize=14;
  pc.strokeStyle='rgba(100,160,255,0.12)'; pc.lineWidth=1;
  pc.beginPath(); pc.moveTo(cx-csize,cy); pc.lineTo(cx+csize,cy); pc.stroke();
  pc.beginPath(); pc.moveTo(cx,cy-csize); pc.lineTo(cx,cy+csize); pc.stroke();
}

// ─── Toques en el pad ────────────────────────────────────────────────────────
padCanvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  const rect=padCanvas.getBoundingClientRect();
  handlePadTap(t.clientX-rect.left, t.clientY-rect.top);
},{ passive:false });

padCanvas.addEventListener('mousedown', e=>{
  const rect=padCanvas.getBoundingClientRect();
  handlePadTap(e.clientX-rect.left, e.clientY-rect.top);
});

function handlePadTap(lx,ly){
  const nx=lx/padW;
  const ny=ly/padH;
  // Ripple visual
  padRipples.push({ x:lx, y:ly, age:0 });
  if(!canWarp) return;
  canWarp=false;
  socket.emit('warp',{ nx, ny });
  warpCount++;
  document.getElementById('warp-count').textContent=warpCount;
}

// ─── Feedback visual en celu ─────────────────────────────────────────────────
const wfEl=document.getElementById('warp-feedback');
let wfTimeout=null;
function showWarpFeedback(){
  wfEl.style.opacity='1';
  if(wfTimeout) clearTimeout(wfTimeout);
  wfTimeout=setTimeout(()=>{ wfEl.style.opacity='0'; },1400);
}

window.addEventListener('resize',()=>{
  if(myIG){ padW=padCanvas.width=padCanvas.offsetWidth; padH=padCanvas.height=padCanvas.offsetHeight; }
});
</script>
</body>
</html>
